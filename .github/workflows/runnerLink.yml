name: RunnerLink Gateway

on:
  workflow_dispatch:
    inputs:
      SSH_PUBLIC_KEY:
        description: 'Your public key for runner access'
        required: true
      MAX_LIFETIME:
        description: 'Max session lifetime in seconds'
        required: false
        default: '3600'
      TUNNEL_PORT:
        description: 'Gateway reverse tunnel port to expose for this runner (2222-2231)'
        required: false
        default: '2222'

jobs:
  ssh-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

      - name: Configure SSHD on runner
        run: |
          sudo systemctl enable ssh
          if [ -z "$(find /etc/ssh/ -name 'ssh_host_*' | xargs echo -n)" ]; then
            DEBIAN_FRONTEND=noninteractive sudo dpkg-reconfigure openssh-server
          fi
          echo "PasswordAuthentication no" | sudo tee -a /etc/ssh/sshd_config
          echo "ChallengeResponseAuthentication no" | sudo tee -a /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Install authorized key (your SSH key)
        env:
          SSH_PUBLIC_KEY: ${{ github.event.inputs.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PUBLIC_KEY" > ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      # PLACEHOLDER: Add your custom workflow steps here
      # These steps run BEFORE the tunnel is established
      # Example: checkout code, run tests, build artifacts, etc.
      - name: Example - Hello World
        run: |
          echo "Hello from GitHub Actions runner!"
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Operating System: $(uname -a)"
          echo "Madness has no purpose. Or reason. But it may have a goal." > HELLO_WORLD
          cat HELLO_WORLD
          
      # PLACEHOLDER: Add more steps as needed
      # - name: Checkout code
      #   uses: actions/checkout@v4
      #
      # - name: Run tests
      #   run: npm test
      #
      # - name: Build application
      #   run: npm run build

      - name: Open reverse SSH tunnel and keep alive
        env:
          GATEWAY_PRIVATE_KEY: ${{ secrets.GATEWAY_PRIVATE_KEY }}
          GATEWAY_HOST: ${{ secrets.GATEWAY_HOST }}
          GATEWAY_PORT: ${{ secrets.GATEWAY_PORT }}
          GATEWAY_USER: ${{ secrets.GATEWAY_USER }}
          MAX_LIFETIME: ${{ github.event.inputs.MAX_LIFETIME }}
          TUNNEL_PORT: ${{ github.event.inputs.TUNNEL_PORT }}
        run: |
          # Write private key directly from secret (preserves formatting)
          echo "$GATEWAY_PRIVATE_KEY" > /tmp/gateway_key
          chmod 400 /tmp/gateway_key
          trap 'rm -f /tmp/gateway_key' EXIT
          
          # Verify key format
          if ! ssh-keygen -l -f /tmp/gateway_key >/dev/null 2>&1; then
            echo "::error::Invalid private key in GATEWAY_PRIVATE_KEY secret"
            exit 1
          fi
          
          echo "Private key loaded successfully ($(ssh-keygen -l -f /tmp/gateway_key | awk '{print $1, $4}'))"
          
          if ! [[ "$TUNNEL_PORT" =~ ^[0-9]+$ ]] || [ "$TUNNEL_PORT" -lt 2222 ] || [ "$TUNNEL_PORT" -gt 2231 ]; then
            echo "::error::TUNNEL_PORT must be in the published gateway range 2222-2231"
            exit 1
          fi

          if ! [[ "$MAX_LIFETIME" =~ ^[0-9]+$ ]] || [ "$MAX_LIFETIME" -le 0 ]; then
            echo "::error::MAX_LIFETIME must be a positive number of seconds"
            exit 1
          fi
          
          echo "::notice::Establishing reverse tunnel: gateway:${TUNNEL_PORT} -> localhost:22"
          echo "::notice::To connect to this runner, use: ssh -p ${TUNNEL_PORT} runner@<gateway-host>"
          echo "::notice::Connection will remain open for ${MAX_LIFETIME} seconds"
          
          deadline=$((SECONDS + 10#$MAX_LIFETIME))
          attempt=1
          consecutive_failures=0
          max_failures=12
          reconnect_delay=10
          max_reconnect_delay=60
          stable_after=60

          echo "::notice::Tunnel supervisor active for ${MAX_LIFETIME} seconds"

          while [ "$SECONDS" -lt "$deadline" ]; do
            remaining=$((deadline - SECONDS))
            attempt_started=$SECONDS
            echo "::notice::Opening reverse tunnel attempt ${attempt} (${remaining}s remaining)"

            if ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=15 \
                -o ConnectionAttempts=1 \
                -o IdentitiesOnly=yes \
                -o ServerAliveInterval=60 \
                -o ServerAliveCountMax=3 \
                -o ExitOnForwardFailure=yes \
                -i /tmp/gateway_key \
                -p "${GATEWAY_PORT}" \
                -R "${TUNNEL_PORT}:localhost:22" \
                -N \
                "${GATEWAY_USER}@${GATEWAY_HOST}"; then
              ssh_status=0
            else
              ssh_status=$?
            fi

            connected_for=$((SECONDS - attempt_started))
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi

            if [ "$ssh_status" -eq 0 ] || [ "$connected_for" -ge "$stable_after" ]; then
              consecutive_failures=0
              reconnect_delay=10
            else
              consecutive_failures=$((consecutive_failures + 1))
            fi

            if [ "$consecutive_failures" -ge "$max_failures" ]; then
              echo "::error::Reverse tunnel failed ${consecutive_failures} times in a row"
              echo "::error::Check gateway host/port reachability, router forwarding, the private key, and authorized_keys"
              exit 1
            fi

            echo "::warning::Reverse tunnel exited with status ${ssh_status} after ${connected_for}s; reconnecting in ${reconnect_delay}s"
            remaining=$((deadline - SECONDS))
            sleep_for=$reconnect_delay
            if [ "$sleep_for" -gt "$remaining" ]; then
              sleep_for=$remaining
            fi
            if [ "$sleep_for" -gt 0 ]; then
              sleep "$sleep_for"
            fi
            attempt=$((attempt + 1))
            if [ "$reconnect_delay" -lt "$max_reconnect_delay" ]; then
              reconnect_delay=$((reconnect_delay * 2))
              if [ "$reconnect_delay" -gt "$max_reconnect_delay" ]; then
                reconnect_delay=$max_reconnect_delay
              fi
            fi
          done

          echo "::notice::Max lifetime reached. Tunnel supervisor exiting..."
